[project]
name = "slam-core-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "rerun-sdk",
    "numpy",
    "opencv-python",
    "pyyaml",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/slam_core_tools"]
